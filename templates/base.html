{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Portfolio{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="container">

            <a href="/" class="logo">
                DEEPAL
            </a>

            <div class="nav-links">

    <a href="/">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#experience">Experience</a>
    <a href="#education">Education</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>

    <button
    id="theme-toggle"
    class="theme-toggle"
    type="button"
    aria-label="Toggle theme"
>
    🌙
</button>

</div>

        </div>

    </nav>


    <!-- Main Content -->

    <main>
        {% block content %}

        {% endblock %}
    </main>


    <!-- Footer -->

    <footer class="footer">

        <p>
            © 2026 Deepal. All Rights Reserved.
        </p>

    </footer>


    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
